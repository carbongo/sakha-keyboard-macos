name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle and diagrams match build.py
        run: |
          python3 build.py
          python3 tools/build-site.py
          git diff --exit-code || { echo "::error::Run python3 build.py and tools/build-site.py and commit the result"; exit 1; }
      - name: Lint shell scripts
        run: shellcheck install.sh tools/package.sh packaging/*.command
      - name: Translations match the English docs
        run: python3 tools/check-translations.py
